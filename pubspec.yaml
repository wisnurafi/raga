name: raga
description: Raga - BMI calculator with history, ideal weight, BMR/TDEE, multi-profile, and cloud backup.
publish_to: 'none'
version: 2.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.4
  fl_chart: ^0.69.0
  share_plus: ^10.1.2
  path_provider: ^2.1.4
  screenshot: ^3.0.0
  flutter_local_notifications: ^19.0.0
  flutter_secure_storage: ^10.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.0
  google_sign_in: ^7.0.0
  image_picker: ^1.0.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/raga-bg.png
    - assets/images/raga-bg-light.png
    - assets/images/raga-mark.png
    - assets/images/raga-mark-light.png
    - assets/images/wrapped/
    - assets/images/detak/
    - assets/avatar/avatar_manifest.json
    - assets/avatar/progression.json
    - assets/avatar/layers/00_bg/
    - assets/avatar/layers/01_back-hair/
    - assets/avatar/layers/02_shirt/
    - assets/avatar/layers/03_neck/
    - assets/avatar/layers/04_head/
    - assets/avatar/layers/05_front-hair/
    - assets/avatar/layers/06_face/
    - assets/avatar/layers/07_accessory/
    - assets/avatar/layers/08_frame/
    - assets/avatar/mask/
    - assets/avatar/composites/
