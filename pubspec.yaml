name: raga
description: Raga - BMI calculator with history, ideal weight, BMR/TDEE, multi-profile, and cloud backup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.8.4
  fl_chart: ^0.69.0
  share_plus: ^10.1.2
  cross_file: ^0.3.4
  path_provider: ^2.1.4
  screenshot: ^3.0.0
  flutter_svg: ^2.0.0
  flutter_local_notifications: ^19.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/raga-background.svg
    - assets/mark/raga-mark.png
