name: Supabase Keep-Alive

# Ping Supabase hourly so the free-tier project doesn't get paused
# (auto-pauses after 7 days of inactivity).
# Needs secrets: SUPABASE_URL and SUPABASE_ANON_KEY.
# If the secrets aren't set, this workflow passes quietly.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets not set - skipping."
            exit 0
          fi
          curl -sf -o /dev/null \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health" \
            && echo "Supabase is active - won't be paused."
