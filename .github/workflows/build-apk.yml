name: Build APK

# On every push to main: analyze, build the release APK, upload it as an
# artifact, and attach it automatically to the GitHub Release "latest".

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create/update the "latest" release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Stamp build number
        # Keeps pubspec's version name (e.g. 1.0.0), stamps the build
        # number from the run number so every "latest" release APK is
        # distinguishable. Fails loudly if the version line format changes.
        run: |
          sed -i -E "s/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/version: \1+${{ github.run_number }}/" pubspec.yaml
          grep -E "^version: [0-9]+\.[0-9]+\.[0-9]+\+${{ github.run_number }}$" pubspec.yaml

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode release keystore
        run: |
          if [ -z "${{ secrets.RAGA_KEYSTORE_BASE64 }}" ]; then
            echo "RAGA_KEYSTORE_BASE64 secret is not set - add it in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "${{ secrets.RAGA_KEYSTORE_BASE64 }}" | base64 -d > android/app/raga-release.keystore

      - name: Build APK (release)
        env:
          RAGA_KEYSTORE_PATH: ${{ github.workspace }}/android/app/raga-release.keystore
          RAGA_KEYSTORE_PASSWORD: ${{ secrets.RAGA_KEYSTORE_PASSWORD }}
          RAGA_KEY_ALIAS: ${{ secrets.RAGA_KEY_ALIAS }}
          RAGA_KEY_PASSWORD: ${{ secrets.RAGA_KEY_PASSWORD }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename APK to Raga.apk
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Raga.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raga-apk
          path: build/app/outputs/flutter-apk/Raga.apk

      - name: Attach APK to "latest" release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: latest
          name: Raga (latest build)
          body: |
            Automated build from the `main` branch.
            Download `Raga.apk`, install it on Android, and try it out.
            Build #${{ github.run_number }}.
          files: build/app/outputs/flutter-apk/Raga.apk
          generate_release_notes: true
