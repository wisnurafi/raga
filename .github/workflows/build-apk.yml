name: Build APK

# On every push to main: analyze, build the release APK, upload it as an
# artifact, and attach it automatically to the GitHub Release "latest".

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create/update the "latest" release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK (release)
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Rename APK to Raga.apk
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Raga.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raga-apk
          path: build/app/outputs/flutter-apk/Raga.apk

      - name: Attach APK to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Raga (latest build)
          body: |
            Automated build from the `main` branch.
            Download `Raga.apk`, install it on Android, and try it out.
          files: build/app/outputs/flutter-apk/Raga.apk
          generate_release_notes: true
